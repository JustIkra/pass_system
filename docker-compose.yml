services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mfc_db
      POSTGRES_USER: mfc_user
      POSTGRES_PASSWORD: mfc_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mfc_user -d mfc_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - "./Исходные данные АИС:/app/source_data:ro"
      - ./models:/app/models
    environment:
      - DATABASE_URL=postgresql+psycopg2://mfc_user:mfc_pass@postgres:5432/mfc_db
      - DATA_DIR=/app/source_data
      - MODELS_DIR=/app/models
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - WEB_CONCURRENCY=0
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000
             --workers $$(nproc)"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  training:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - "./Исходные данные АИС:/app/source_data:ro"
      - ./models:/app/models
      - ./scripts:/app/scripts
      - ./data:/app/data
    environment:
      - DATABASE_URL=postgresql+psycopg2://mfc_user:mfc_pass@postgres:5432/mfc_db
      - DATA_DIR=/app/source_data
      - MODELS_DIR=/app/models
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - training
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["python"]
    command: ["scripts/train_model.py", "--validate", "--gpu"]

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
