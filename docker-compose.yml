services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mfc_db
      POSTGRES_USER: mfc_user
      POSTGRES_PASSWORD: mfc_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backup.dump:/docker-entrypoint-initdb.d/backup.dump:ro
      - ./scripts/docker-restore.sh:/docker-entrypoint-initdb.d/01-restore.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mfc_user -d mfc_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://mfc_user:mfc_pass@postgres:5432/mfc_db
      - DATA_DIR=/app/source_data
      - MODELS_DIR=/app/models
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    # Single worker: in-memory forecast generation state requires shared memory
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
